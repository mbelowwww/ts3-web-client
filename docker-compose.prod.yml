services:
  ts3server:
    image: teamspeak:latest
    container_name: ts3web-server
    restart: unless-stopped
    environment:
      TS3SERVER_LICENSE: accept
    ports:
      - "9987:9987/udp"   # голос
      - "10011:10011/tcp" # ServerQuery (raw)
      - "30033:30033/tcp" # передача файлов
    volumes:
      - ts3_data:/var/ts3server/

  ts3web:
    build: .
    container_name: ts3web-gateway
    restart: unless-stopped
    depends_on:
      - ts3server
    env_file: .env
    environment:
      # Внутри docker-сети сервисы видны друг другу по имени — не 127.0.0.1.
      TS3_HOST: ts3server
      TS3_VOICE_HOST: ts3server
    ports:
      # Только на loopback — снаружи недоступно. Нужно, если TLS уже терминирует
      # СВОЙ nginx на хосте (см. DEPLOY.md, «Сценарий Б») и ходит сюда напрямую;
      # для сценария с self-signed (nginx ниже, в docker) не используется, но
      # публикация на 127.0.0.1 ничему не мешает и в этом случае.
      - "127.0.0.1:3000:3000"

  # Нужен только для сценария "домена/HTTPS ещё нет" (self-signed, см. DEPLOY.md,
  # «Сценарий А»). Если TLS уже терминирует свой nginx на хосте — не поднимайте
  # этот сервис вообще: `docker compose -f docker-compose.prod.yml up -d --build ts3server ts3web`.
  nginx:
    image: nginx:alpine
    container_name: ts3web-nginx
    restart: unless-stopped
    depends_on:
      - ts3web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf.example:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx-entrypoint.sh:/nginx-entrypoint.sh:ro
      - ts3web_ssl:/etc/nginx/ssl
    entrypoint: ["/bin/sh", "/nginx-entrypoint.sh"]

volumes:
  ts3_data:
  ts3web_ssl:
